services:
  - type: web
    name: qlseller
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: qlseller-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CHANNEL_CREDENTIAL_KEY
        generateValue: true
      - key: BOOTSTRAP_ORGANIZATION_NAME
        value: QL Seller
      - key: BOOTSTRAP_ORGANIZATION_CODE
        value: QLSELLER
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: phamduykhanh911@gmail.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: qlseller-db
    plan: free
    region: singapore
    databaseName: qlseller
    user: qlseller
